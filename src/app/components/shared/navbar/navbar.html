<style>
  nav {
    display: flex;
    justify-content: space-around;
    background-color: #212121;
    color: white;
    padding: 10px;
  }
  nav a {
    color: white;
    text-decoration: none;
  }
  /* Estilo que se aplicará automáticamente al enlace activo */
  nav a.active {
    color: #f87171;
    font-weight: bold;
    text-decoration: underline;
  }
</style>

<nav>
  <a
  routerLink="/"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }">Contador</a>
  <a
  [routerLink]="['/hero']"
  [routerLinkActive]="'active'">Hero</a>
  <a
  [routerLink]="['/dragonball']"
  [routerLinkActive]="'active'">DragonBall</a>
</nav>
